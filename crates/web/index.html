<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Gecko</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: #ccc;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #setup h2 {
            margin-bottom: 4px;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-row .file-label {
            width: 100px;
            text-align: right;
            color: #aaa;
            font-size: 14px;
        }

        .file-picker {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex: 0 0 auto;
            width: auto;
            white-space: nowrap;
            line-height: 1.2;
            text-align: center;
        }

        .file-row .name {
            color: #8f8;
            font-size: 14px;
            min-width: 120px;
        }

        .file-picker,
        #start {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .file-picker:hover,
        #start:hover {
            background: #444;
            border-color: #8f8;
        }

        #start {
            margin-top: 8px;
            padding: 10px 32px;
            font-size: 16px;
            align-self: stretch;
            text-align: center;
        }

        #start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        canvas {
            width: 100vw;
            height: 100vh;
        }

        .file-picker input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- shoutout to hazel, vxpm, geo, pdawg, lycoder and everyone else :> -->

    <div id="setup">
        <div class="file-row">
            <label class="file-label">IPL / DOL:</label>
            <label class="file-picker">
                <span>Choose file</span>
                <input type="file" id="input-rom" accept=".dol,.bin,.iso,.rvz,.zip">
            </label>
            <span class="name" id="rom-name">none</span>
        </div>

        <div class="file-row">
            <label class="file-label">DSP IROM (optional):</label>
            <label class="file-picker">
                <span>Choose file</span>
                <input type="file" id="input-dsp" accept=".bin">
            </label>
            <span class="name" id="dsp-name">Dolphin's DSP ROM</span>
        </div>

        <button id="start" disabled>Start</button>
        <div id="load-status" role="status" aria-live="polite" style="max-width:420px;text-align:center;font-size:13px;color:#aaa"></div>
    </div>

    <script type="module">
        import init, { begin_emulator_rom_load, write_emulator_rom_chunk, finish_emulator_rom_load, cancel_emulator_rom_load } from './pkg/gecko_web.js';

        async function run() {
            await init();

            let romReady = false;
            let romName = '';
            let dspData = null;

            const inputRom = document.getElementById('input-rom');
            const inputDsp = document.getElementById('input-dsp');
            const romNameEl = document.getElementById('rom-name');
            const dspNameEl = document.getElementById('dsp-name');
            const startBtn = document.getElementById('start');
            const loadStatus = document.getElementById('load-status');
            const CHUNK_SIZE = 8 * 1024 * 1024;

            // Keep each temporary read bounded instead of allocating a second
            // whole-file ArrayBuffer. The current Rust/WASM API still requires
            // one complete byte array, but this avoids the extra full-file buffer.
            async function readFileInChunks(file, label) {
                if (file.size > 0xFFFFFFFF) throw new Error('Files larger than 4 GiB are not supported by this loader.');
                const result = new Uint8Array(file.size);
                for (let offset = 0; offset < file.size; offset += CHUNK_SIZE) {
                    const end = Math.min(offset + CHUNK_SIZE, file.size);
                    const part = await file.slice(offset, end).arrayBuffer();
                    result.set(new Uint8Array(part), offset);
                    loadStatus.textContent = label + ': reading ' + Math.round(end / file.size * 100) + '% (' + Math.round(end / 1048576) + ' / ' + Math.round(file.size / 1048576) + ' MiB)';
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
                return result;
            }

            inputRom.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                startBtn.disabled = true;
                romData = null;
                romName = file.name;
                romNameEl.textContent = file.name;
                try {
                    romData = await readFileInChunks(file, 'Disc image');
                    loadStatus.textContent = 'Loaded ' + file.name + '. Ready to start.';
                    startBtn.disabled = false;
                } catch (error) {
                    loadStatus.textContent = 'Could not read file: ' + error.message;
                    romNameEl.textContent = 'failed';
                }
            });

            inputDsp.addEventListener('change', async (e) => {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    dspData = new Uint8Array(await file.arrayBuffer());
                    dspNameEl.textContent = file.name;
                }
            });

            startBtn.addEventListener('click', () => {
                if (!romData) return;
                startBtn.disabled = true;
                loadStatus.textContent = 'Starting emulator…';
                document.getElementById('setup').style.display = 'none';
                start_emulator(romData, romName, dspData ?? undefined);
            });
        }

        run();
    </script>
</body>

</html>
