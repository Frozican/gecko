<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gecko browser disc reader test</title>
  <style>
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
    label { display: block; margin: .8rem 0; }
    input, button { font: inherit; padding: .4rem; max-width: 100%; }
    button { margin: .3rem .3rem .3rem 0; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f2f2f2; color: #111; padding: 1rem; border-radius: .5rem; }
    .note { color: #555; }
  </style>
</head>
<body>
  <h1>Browser disc-reader test</h1>
  <p class="note">Development harness for Gecko's WASM range reader. It reads only the requested ranges, never the complete disc image. Build the web package first and serve this page over HTTP from the <code>crates/web</code> directory.</p>
  <label>Disc image file: <input id="file" type="file"></label>
  <div>
    <button id="run" disabled>Run bounded range tests</button>
    <button id="probe" disabled>Probe NKit metadata</button>
    <button id="clear">Clear output</button>
  </div>
  <pre id="output" aria-live="polite">Choose a disc image to begin.</pre>
  <script type="module">
    import init, { BrowserDiscReader } from "./pkg/gecko_web.js";

    const fileInput = document.querySelector("#file");
    const runButton = document.querySelector("#run");
    const probeButton = document.querySelector("#probe");
    const output = document.querySelector("#output");
    let wasmReady = false;

    function log(message) {
      output.textContent += message + "\n";
    }

    function hex(bytes, limit = 64) {
      const shown = Array.from(bytes.slice(0, limit), b => b.toString(16).padStart(2, "0")).join(" ");
      return bytes.length > limit ? shown + " …" : shown;
    }

    fileInput.addEventListener("change", () => {
      runButton.disabled = !wasmReady || !fileInput.files?.length;
      probeButton.disabled = !wasmReady || !fileInput.files?.length;
      output.textContent = fileInput.files?.length
        ? "Selected: " + fileInput.files[0].name + " (" + fileInput.files[0].size.toLocaleString() + " bytes)\n"
        : "Choose a disc image to begin.\n";
    });

    probeButton.addEventListener("click", async () => {
      probeButton.disabled = true;
      try {
        const file = fileInput.files[0];
        const reader = new BrowserDiscReader(file);
        log("\nStarting bounded NKit metadata probe...");
        log(await reader.probe_nkit());
      } catch (error) {
        log("\nNKit probe failed: " + (error?.stack || error));
      } finally {
        probeButton.disabled = !wasmReady || !fileInput.files?.length;
      }
    });

    document.querySelector("#clear").addEventListener("click", () => {
      output.textContent = "";
    });

    runButton.addEventListener("click", async () => {
      runButton.disabled = true;
      try {
        const file = fileInput.files[0];
        const reader = new BrowserDiscReader(file);
        log("Reader size: " + reader.size.toLocaleString() + " bytes");
        const size = reader.size;
        const tests = [
          ["start", 0, Math.min(64, size)],
          ["middle", Math.max(0, Math.floor(size / 2) - 32), Math.min(64, size)],
          ["end", Math.max(0, size - 64), Math.min(64, size)]
        ];
        if (size > 256 * 1024 + 32) {
          tests.push(["cross chunk boundary", 256 * 1024 - 16, 64]);
          tests.push(["repeat cached boundary", 256 * 1024 - 16, 64]);
        }
        let passed = 0;
        for (const [name, offset, length] of tests) {
          const started = performance.now();
          const bytes = await reader.read_range(offset, length);
          const elapsed = (performance.now() - started).toFixed(1);
          const reference = new Uint8Array(await file.slice(offset, offset + length).arrayBuffer());
          const equal = bytes.length === reference.length && bytes.every((value, index) => value === reference[index]);
          if (!equal) throw new Error(name + " mismatch at offset " + offset);
          passed++;
          log("PASS " + name + ": offset " + offset + ", " + bytes.length + " bytes, " + elapsed + " ms");
          log("  " + hex(bytes));
        }
        log("\nRESULT: " + passed + "/" + tests.length + " ranges matched File.slice().");
        log("This tests the range-reader primitive only; it does not boot a Wii game.");
      } catch (error) {
        log("\nFAIL: " + (error?.stack || error));
      } finally {
        runButton.disabled = !fileInput.files?.length;
      }
    });

    try {
      await init();
      wasmReady = true;
      runButton.disabled = !fileInput.files?.length;
      probeButton.disabled = !fileInput.files?.length;
      log("WASM module initialized.");
    } catch (error) {
      log("WASM initialization failed: " + (error?.stack || error));
    }
  </script>
</body>
</html>
